name: Quality

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install frontend dependencies
        run: bun install --frozen-lockfile
      - name: Verify generated backend seed
        run: |
          node scripts/export-demo-snapshot.mjs
          git diff --exit-code -- backend/data/demo_snapshot.json
      - name: Frontend checks
        run: bun run check
      - name: Verify Cloudflare staging build and config
        run: |
          bun run build:staging
          bun run verify:cloudflare:staging
          bun run prepare:cloudflare:staging

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ai_radar_test
          POSTGRES_USER: ai_radar
          POSTGRES_PASSWORD: test-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ai_radar -d ai_radar_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt
      - name: Static checks
        run: |
          python -m ruff format --check app tests migrations ../scripts/eval_retrieval.py
          python -m ruff check app tests migrations ../scripts/eval_retrieval.py
          python -m compileall -q app tests migrations ../scripts/eval_retrieval.py
      - name: Verify migration
        env:
          AI_RADAR_DATABASE_URL: sqlite:///./migration-test.db
        run: |
          python -m alembic upgrade head
          python -m alembic current --check-heads
          python -m alembic check
      - name: Verify PostgreSQL migration
        env:
          AI_RADAR_DATABASE_URL: postgresql+psycopg://ai_radar:test-only-password@127.0.0.1:5432/ai_radar_test
        run: |
          python -m alembic upgrade head
          python -m alembic current --check-heads
          python -m alembic check
      - name: Backend tests
        run: python -m pytest
      - name: PostgreSQL lexical retrieval baseline
        env:
          EVALUATION_DATABASE_URL: postgresql+psycopg://ai_radar:test-only-password@127.0.0.1:5432/ai_radar_test
        run: |
          python ../scripts/eval_retrieval.py \
            --snapshot ../docs/eval/snapshots/public_snapshot_2026-08-30.json \
            --golden-set ../docs/eval/retrieval_golden_set.jsonl \
            --output-dir ../artifacts/retrieval-postgresql \
            --database-url "$EVALUATION_DATABASE_URL" \
            --top-k 8 \
            --evaluation-commit "$GITHUB_SHA"
          printf '## PostgreSQL 16 lexical retrieval baseline\n\n' >> "$GITHUB_STEP_SUMMARY"
          sed '1d' ../artifacts/retrieval-postgresql/*.md >> "$GITHUB_STEP_SUMMARY"
          part=0
          gzip -c ../artifacts/retrieval-postgresql/*.json | base64 -w 3500 | while read -r chunk; do
            printf -v part_id '%03d' "$part"
            echo "::notice title=PostgreSQL retrieval report chunk $part_id::$chunk"
            part=$((part + 1))
          done
      - name: Upload PostgreSQL retrieval baseline
        uses: actions/upload-artifact@v4
        with:
          name: retrieval-postgresql-${{ github.sha }}
          path: artifacts/retrieval-postgresql
          if-no-files-found: error
          retention-days: 14

name: Quality

on:
  push:
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install frontend dependencies
        run: bun install --frozen-lockfile
      - name: Verify generated backend seed
        run: |
          node scripts/export-demo-snapshot.mjs
          git diff --exit-code -- backend/data/demo_snapshot.json
      - name: Frontend checks
        run: npm run check

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ai_radar_test
          POSTGRES_USER: ai_radar
          POSTGRES_PASSWORD: test-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ai_radar -d ai_radar_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt
      - name: Static checks
        run: |
          python -m ruff format --check app tests migrations
          python -m ruff check app tests migrations
          python -m compileall -q app tests migrations
      - name: Verify migration
        env:
          AI_RADAR_DATABASE_URL: sqlite:///./migration-test.db
        run: |
          python -m alembic upgrade head
          python -m alembic current
      - name: Verify PostgreSQL migration
        env:
          AI_RADAR_DATABASE_URL: postgresql+psycopg://ai_radar:test-only-password@127.0.0.1:5432/ai_radar_test
        run: |
          python -m alembic upgrade head
          python -m alembic current
      - name: Backend tests
        run: python -m pytest

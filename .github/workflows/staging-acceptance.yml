name: Staging acceptance

on:
  workflow_run:
    workflows: [Quality]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: staging-acceptance
  cancel-in-progress: true

jobs:
  verify-staging:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Wait for Render and Cloudflare to run the verified commit
        run: npm run verify:staging-release
        env:
          AI_RADAR_EXPECTED_COMMIT: ${{ github.event.workflow_run.head_sha }}
          AI_RADAR_STAGING_READY_URL: https://ai-radar-api-staging.onrender.com/ready
          AI_RADAR_STAGING_VERSION_URL: https://ai-radar.xue-ai.workers.dev/version.txt
      - name: Run staging smoke test
        run: npm run smoke:staging
        env:
          AI_RADAR_SMOKE_API_URL: https://ai-radar-api-staging.onrender.com
          AI_RADAR_SMOKE_FRONTEND_URL: https://ai-radar.xue-ai.workers.dev
          # The browser reaches the API only through this same-origin Worker proxy;
          # checking it directly (not just the API) is what would have caught the
          # 2026-10-30 incident where Workers Cache broke GET/HEAD through it while
          # the API and the frontend page both stayed healthy.
          AI_RADAR_SMOKE_PROXY_URL: https://ai-radar.xue-ai.workers.dev/backend

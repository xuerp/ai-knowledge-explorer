[project]
name = "ai-radar-api"
version = "0.1.0"
description = "Trusted data API and review workflow for AI Radar"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35,<1",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.16,<2",
  "email-validator>=2.2,<3",
  "pyjwt>=2.10,<3",
  "pwdlib[argon2]>=0.3,<1",
  "psycopg[binary]>=3.2,<4",
  "tzdata>=2025.2",
]

[project.optional-dependencies]
test = [
  "httpx>=0.28,<1",
  "pytest>=8.4,<10",
  "ruff>=0.12,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
  "ignore:Using `httpx` with `starlette.testclient` is deprecated.*",
]

[tool.ruff]
line-length = 100
target-version = "py312"

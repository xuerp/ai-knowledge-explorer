<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#0b111b" />
    <title>离线 · AI Radar</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: Inter, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
        background: #f8f4eb;
        color: #28221f;
      }
      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        margin: 0;
        padding: 24px;
        box-sizing: border-box;
      }
      main {
        width: min(100%, 520px);
        border: 1px solid #ded7ca;
        border-radius: 16px;
        background: #fff;
        padding: 32px;
        box-sizing: border-box;
        box-shadow: 0 16px 50px rgb(28 20 14 / 8%);
      }
      .mark {
        width: 44px;
        height: 44px;
        border-radius: 12px;
        display: grid;
        place-items: center;
        background: #0b111b;
        color: #e65f32;
        font-weight: 700;
      }
      h1 {
        margin: 20px 0 8px;
        font-family: Georgia, "Noto Serif SC", serif;
        font-size: 28px;
      }
      p {
        color: #736a61;
        line-height: 1.7;
      }
      button {
        margin-top: 16px;
        min-height: 40px;
        border: 0;
        border-radius: 8px;
        background: #cf502c;
        color: #fff;
        padding: 0 16px;
        font: inherit;
        cursor: pointer;
      }
      small {
        display: block;
        margin-top: 20px;
        color: #8d8378;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          background: #15120f;
          color: #f3eee5;
        }
        main {
          border-color: #3f3730;
          background: #211c18;
        }
        p,
        small {
          color: #b9aea3;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">◎</div>
      <h1>当前处于离线状态</h1>
      <p>
        AI Radar
        无法连接网络。已访问过的页面可能仍可从本地缓存打开；未缓存的实时请求不会被演示数据替代。
      </p>
      <button type="button" onclick="location.reload()">重新连接</button>
      <small id="cached-at">正在读取最后缓存时间…</small>
    </main>
    <script>
      const value = localStorage.getItem("ai-radar.last-online-at");
      document.getElementById("cached-at").textContent = value
        ? `最后在线缓存：${new Date(value).toLocaleString()}`
        : "当前设备没有可用的缓存时间记录";
    </script>
  </body>
</html>

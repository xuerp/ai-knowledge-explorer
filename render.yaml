# yaml-language-server: $schema=https://render.com/schema/render.yaml.json

previews:
  generation: off

envVarGroups:
  - name: ai-radar-staging-runtime
    envVars:
      - key: AI_RADAR_ENVIRONMENT
        value: production
      - key: AI_RADAR_DATA_MODE
        value: demo
      - key: AI_RADAR_ACCESS_TOKEN_MINUTES
        value: "30"
      - key: AI_RADAR_FETCH_RETRY_BASE_MINUTES
        value: "15"
      - key: AI_RADAR_FETCH_RETRY_MAX_MINUTES
        value: "360"
      - key: AI_RADAR_FETCH_LEASE_MINUTES
        value: "5"
      - key: AI_RADAR_EMAIL_MAX_ATTEMPTS
        value: "5"
      - key: AI_RADAR_EMAIL_RETRY_BASE_SECONDS
        value: "300"
      - key: AI_RADAR_EMAIL_LEASE_SECONDS
        value: "120"
      - key: AI_RADAR_DIGEST_TIMEZONE
        value: Asia/Shanghai
      - key: AI_RADAR_WORKER_ID
        value: scheduler-staging
      - key: AI_RADAR_WORKER_HEARTBEAT_SECONDS
        value: "30"
      - key: AI_RADAR_WORKER_STALE_SECONDS
        value: "180"

services:
  - type: web
    name: ai-radar-api-staging
    runtime: docker
    plan: starter
    region: singapore
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /ready
    preDeployCommand: python -m alembic upgrade head
    maxShutdownDelaySeconds: 90
    autoDeployTrigger: checksPass
    envVars:
      - fromGroup: ai-radar-staging-runtime
      - key: AI_RADAR_DATABASE_URL
        fromDatabase:
          name: ai-radar-postgres-staging
          property: connectionString
      - key: AI_RADAR_JWT_SECRET
        generateValue: true
      - key: AI_RADAR_ADMIN_TOKEN
        sync: false
      - key: AI_RADAR_CORS_ORIGINS
        sync: false

  - type: worker
    name: ai-radar-worker-staging
    runtime: docker
    plan: starter
    region: singapore
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    dockerCommand: >-
      sh -c 'until python -m alembic current --check-heads; do sleep 5; done;
      exec python -m app.worker --interval-seconds 900'
    maxShutdownDelaySeconds: 90
    numInstances: 1
    autoDeployTrigger: checksPass
    envVars:
      - fromGroup: ai-radar-staging-runtime
      - key: AI_RADAR_SERVICE_ROLE
        value: worker
      - key: AI_RADAR_DATABASE_URL
        fromDatabase:
          name: ai-radar-postgres-staging
          property: connectionString

databases:
  - name: ai-radar-postgres-staging
    plan: basic-256mb
    region: singapore
    postgresMajorVersion: "16"
    databaseName: ai_radar
    user: ai_radar
    diskSizeGB: 15
    storageAutoscalingEnabled: false
    connectionPool: none
    ipAllowList: []

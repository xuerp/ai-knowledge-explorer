# yaml-language-server: $schema=https://render.com/schema/render.yaml.json

previews:
  generation: off

envVarGroups:
  - name: ai-radar-staging-runtime
    envVars:
      - key: AI_RADAR_ENVIRONMENT
        value: production
      - key: AI_RADAR_DATA_MODE
        value: demo
      - key: AI_RADAR_ACCESS_TOKEN_MINUTES
        value: "30"
      - key: AI_RADAR_FETCH_RETRY_BASE_MINUTES
        value: "15"
      - key: AI_RADAR_FETCH_RETRY_MAX_MINUTES
        value: "360"
      - key: AI_RADAR_FETCH_LEASE_MINUTES
        value: "5"
      - key: AI_RADAR_AUTO_EXTRACTION_MAX_SNAPSHOTS_PER_CYCLE
        # 四个定向关系 Snapshot 已安全保存；取得新批次模型调用授权前保持暂停。
        value: "0"
      - key: AI_RADAR_AUTO_EXTRACTION_MAX_CANDIDATES_PER_SNAPSHOT
        value: "10"
      - key: AI_RADAR_AUTO_EXTRACTION_RETRY_MINUTES
        value: "360"
      - key: AI_RADAR_AUTO_APPROVE_GROUNDED_RELATIONS
        value: "false"
      # 一次性关系补齐批次：总请求数由后端审计日志硬限制为最多 10 次。
      # 相同批次 ID 在服务重启或 Cron 重复触发后不会重新消费额度。
      - key: AI_RADAR_RELATION_BACKFILL_BATCH_ID
        value: 2026-08-core-relations-01
      - key: AI_RADAR_RELATION_BACKFILL_MAX_SNAPSHOTS
        value: "10"
      # Hybrid 只在 staging 开启；凭证缺失、预算超限或 provider 异常时自动降级 lexical。
      - key: AI_RADAR_RETRIEVAL_MODE
        value: hybrid
      - key: AI_RADAR_EMBEDDING_PROVIDER
        value: cloudflare
      - key: AI_RADAR_EMBEDDING_MODEL
        value: "@cf/baai/bge-m3"
      - key: AI_RADAR_EMBEDDING_VERSION
        value: "cloudflare-managed:@cf/baai/bge-m3:2026-08-31-baseline"
      - key: AI_RADAR_EMBEDDING_DIMENSION
        value: "1024"
      - key: AI_RADAR_EMBEDDING_DAILY_NEURON_BUDGET
        value: "1000"
      - key: AI_RADAR_EMBEDDING_NEURONS_PER_MILLION_TOKENS
        value: "1075"
      - key: AI_RADAR_EMBEDDING_DAILY_API_CALL_BUDGET
        value: "1000"
      # 首批仅允许现有演示目录中的官方站点。信源仍默认关闭自动采集，
      # 必须在审核后台通过批量安全预检后启用，并核验首次快照后才进入定时任务。
      - key: AI_RADAR_FETCH_ALLOWED_HOSTS
        value: openai.com,developers.openai.com,anthropic.com,platform.claude.com,deepmind.google,ai.google.dev,cursor.com,docs.cursor.com,docs.langchain.com,ernie.baidu.com,modelcontextprotocol.io,platform.kimi.ai,qwenlm.ai,seed.bytedance.com,moonshot.ai,swebench.com,arxiv.org,raw.githubusercontent.com,microsoft.github.io,docs.crewai.com,docs.devin.ai,help.manus.im
      - key: AI_RADAR_EMAIL_MAX_ATTEMPTS
        value: "5"
      - key: AI_RADAR_EMAIL_RETRY_BASE_SECONDS
        value: "300"
      - key: AI_RADAR_EMAIL_LEASE_SECONDS
        value: "120"
      - key: AI_RADAR_DIGEST_TIMEZONE
        value: Asia/Shanghai
      - key: AI_RADAR_AUTOMATION_CYCLE_LEASE_SECONDS
        value: "900"
      - key: AI_RADAR_WORKER_STALE_SECONDS
        value: "3900"

services:
  - type: web
    name: ai-radar-api-staging
    runtime: docker
    plan: free
    region: singapore
    branch: codex/productionize
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    # Render 的服务存活检查不得依赖 Neon 延迟；数据库与迁移就绪状态仍由
    # 部署后冒烟显式检查 /ready。
    healthCheckPath: /health
    # 当前仓库的 checksPass 事件没有持续触发 Blueprint 服务更新，导致前端与
    # API 版本长期不一致。分支提交后直接构建，应用自身仍会在启动前执行迁移与
    # /ready 健康检查；GitHub Quality 同时保留完整质量门禁。
    autoDeployTrigger: commit
    envVars:
      - fromGroup: ai-radar-staging-runtime
      - key: PORT
        value: "8000"
      - key: AI_RADAR_DATABASE_URL
        sync: false
      - key: AI_RADAR_JWT_SECRET
        generateValue: true
      - key: AI_RADAR_ADMIN_TOKEN
        sync: false
      - key: AI_RADAR_AUTOMATION_TOKEN
        sync: false
      - key: CLOUDFLARE_ACCOUNT_ID
        sync: false
      - key: CLOUDFLARE_API_TOKEN
        sync: false
      - key: AI_RADAR_CORS_ORIGINS
        sync: false
